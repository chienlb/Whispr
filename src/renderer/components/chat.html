<!-- =================================================================== -->
<!-- COMPONENT: CHANNEL CHAT ROOM PAGE -->
<!-- =================================================================== -->
<div id="page-chat-view" style="width:100%; max-width:820px; height:100%; display:none; flex-direction:column; gap:12px;">
  <div style="padding:14px 20px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-sm);">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:1.2rem; color:var(--primary);">💬</span>
      <div>
        <div style="font-weight:800; font-size:0.95rem;" id="chat-title-text"># Thảo Luận Chung</div>
        <div style="font-size:0.75rem; color:var(--text-muted);">Kênh thảo luận công việc & tin tức chung</div>
      </div>
    </div>
    <div style="font-size:0.8rem; color:#10b981; font-weight:700;">🟢 5 Thành viên online</div>
  </div>

  <div class="chat-messages-area" id="chat-messages-scroll" style="flex:1; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;">
    <!-- Messages rendered dynamically -->
  </div>

  <div style="display:flex; gap:10px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:10px 14px;">
    <input type="text" id="chat-room-input" class="auth-input-field" placeholder="Nhập tin nhắn vào kênh... (Enter để gửi)" style="padding-left:16px;">
    <button class="btn-submit-auth" id="btn-send-chat-msg" style="width:auto; padding:8px 20px;">Gửi</button>
  </div>
</div>
